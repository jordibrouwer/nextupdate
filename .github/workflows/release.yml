name: Release

# Pushing a tag such as v0.1.0 tests the code, builds a multi-arch image
# (amd64 and arm64), pushes it to GHCR (and to Docker Hub when the
# DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret exist), and creates
# a GitHub release. It can also be started by hand for a dry run of the build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image (a tag build always pushes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push the image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      packages: write   # GHCR
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      PUSH: ${{ github.ref_type == 'tag' || inputs.push }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo 'list<<EOF'
            echo "ghcr.io/${repo}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then echo "docker.io/${DOCKERHUB_USERNAME}/nextupdate"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.PUSH == 'true' && env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
